name: Diagnose Product Media and Templates

on:
  push:
    branches: [diag/media-gabaritos-20260914]

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: [self-hosted, central-prints, vps, production]
    timeout-minutes: 10
    steps:
      - name: Verify product visuals and template download formats
        shell: bash
        run: |
          set -Eeuo pipefail
          node --input-type=module <<'NODE'
          const base='https://grafica.belastock.com.br';
          const expected='dbb014ce37908a834b1553d78e263994eb6f8a85';
          const get=async(path)=>{
            const url=path.startsWith('http')?path:base+path;
            const r=await fetch(url);
            const buf=Buffer.from(await r.arrayBuffer());
            return {status:r.status,type:r.headers.get('content-type')||'',disposition:r.headers.get('content-disposition')||'',text:buf.toString('utf8'),buf,bytes:buf.length,url};
          };
          const release=await get('/api/release');
          console.log('RELEASE',release.status,release.text);
          if(release.status!==200||!release.text.includes(expected))throw new Error('WRONG_RELEASE');
          const health=await get('/api/health');
          const ready=await get('/api/ready');
          if(health.status!==200||ready.status!==200)throw new Error('HEALTH_NOT_READY');

          const homeHtml=await get('/');
          const catalogHtml=await get('/catalogo.html');
          const productHtml=await get('/produto.html?slug=adesivos-adesivo-bopp-branco-05bfd990');
          const gabaritosHtml=await get('/gabaritos.html?slug=adesivos-adesivo-bopp-branco-05bfd990');
          for(const [name,page] of [['HOME',homeHtml],['CATALOG',catalogHtml],['PRODUCT',productHtml]]){
            console.log(name,page.status,page.bytes);
            if(page.status!==200||!page.text.includes('/assets/visual-runtime.js?v=20260915-4')||!page.text.includes('/assets/visual-runtime.css?v=20260915-4'))throw new Error(name+'_VISUAL_RUNTIME_MISSING');
          }
          if(!catalogHtml.text.includes('/assets/catalog.js?v=20260915-4'))throw new Error('CATALOG_CACHE_BUST_MISSING');
          if(!productHtml.text.includes('/assets/product.js?v=20260915-4'))throw new Error('PRODUCT_CACHE_BUST_MISSING');
          if(gabaritosHtml.status!==200||!gabaritosHtml.text.includes('SVG, PDF, EPS e PSD')||!gabaritosHtml.text.includes('/assets/gabaritos.js?v=20260915-4'))throw new Error('GAB_PAGE_FORMAT_COPY_MISSING');
          const runtime=await get('/assets/visual-runtime.js?v=20260915-4');
          if(runtime.status!==200||!runtime.text.includes('inlineTechnicalImage')||!runtime.text.includes('MutationObserver'))throw new Error('VISUAL_RUNTIME_BAD');
          const catalogJs=await get('/assets/catalog.js?v=20260915-4');
          if(catalogJs.status!==200||!catalogJs.text.includes('hydrateSvgVisuals')||!catalogJs.text.includes('product-visual-inline'))throw new Error('CATALOG_VISUAL_CODE_BAD');
          console.log('VISUAL_RUNTIME=OK');

          const productsRes=await get('/api/v1/products?limit=5');
          if(productsRes.status!==200)throw new Error('PRODUCTS_HTTP_'+productsRes.status);
          const products=JSON.parse(productsRes.text).items||[];
          if(!products.length)throw new Error('NO_PRODUCTS');
          for(const p of products){
            console.log('PRODUCT',JSON.stringify({slug:p.slug,image_url:p.image_url,image_type:p.image_type,gabaritos_url:p.gabaritos_url,gabaritos_api_url:p.gabaritos_api_url}));
            if(!p.image_url)throw new Error('IMAGE_URL_EMPTY_'+p.slug);
            const image=await get(p.image_url);
            console.log('IMAGE',image.status,image.type,image.bytes,p.image_url);
            if(image.status!==200||!image.type.includes('image/svg+xml')||image.bytes<500||!image.text.includes('<svg'))throw new Error('IMAGE_BAD_'+p.slug);
          }

          const firstProduct=products[0];
          const list=await get(firstProduct.gabaritos_api_url);
          if(list.status!==200)throw new Error('GAB_API_HTTP_'+list.status);
          const data=JSON.parse(list.text);
          const first=data.items?.[0];
          if(!first)throw new Error('NO_GABARITO');
          const formats=(first.formats||[]).map(x=>x.format).sort();
          console.log('GAB_FORMATS',formats.join(','));
          for(const required of ['svg','pdf','eps','psd'])if(!formats.includes(required))throw new Error('FORMAT_MISSING_'+required);
          const byFormat=Object.fromEntries(first.formats.map(x=>[x.format,x]));

          const svg=await get(byFormat.svg.url);
          console.log('SVG',svg.status,svg.type,svg.disposition,svg.bytes);
          if(svg.status!==200||!svg.type.includes('image/svg+xml')||!svg.disposition.includes('attachment')||!svg.text.includes('<svg'))throw new Error('SVG_DOWNLOAD_BAD');
          const pdf=await get(byFormat.pdf.url);
          console.log('PDF',pdf.status,pdf.type,pdf.disposition,pdf.bytes,pdf.buf.subarray(0,4).toString('ascii'));
          if(pdf.status!==200||!pdf.type.includes('application/pdf')||!pdf.disposition.includes('attachment')||pdf.buf.subarray(0,4).toString('ascii')!=='%PDF')throw new Error('PDF_DOWNLOAD_BAD');
          const eps=await get(byFormat.eps.url);
          console.log('EPS',eps.status,eps.type,eps.disposition,eps.bytes,eps.buf.subarray(0,4).toString('ascii'));
          if(eps.status!==200||!eps.type.includes('application/postscript')||!eps.disposition.includes('attachment')||!eps.text.startsWith('%!PS'))throw new Error('EPS_DOWNLOAD_BAD');
          const psd=await get(byFormat.psd.url);
          console.log('PSD',psd.status,psd.type,psd.disposition,psd.bytes,psd.buf.subarray(0,4).toString('ascii'));
          if(psd.status!==200||!psd.type.includes('photoshop')||!psd.disposition.includes('attachment')||psd.buf.subarray(0,4).toString('ascii')!=='8BPS')throw new Error('PSD_DOWNLOAD_BAD');
          console.log('PRODUCT_VISUALS_AND_GABARITOS=OK');
          NODE
