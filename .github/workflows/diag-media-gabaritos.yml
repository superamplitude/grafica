name: Diagnose Product Media and Templates

on:
  push:
    branches: [diag/media-gabaritos-20260914]

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: [self-hosted, central-prints, vps, production]
    timeout-minutes: 10
    steps:
      - name: Diagnose live endpoints
        shell: bash
        run: |
          set -Eeuo pipefail
          node --input-type=module <<'NODE'
          const base='http://127.0.0.1:3005';
          const get=async(url)=>{const r=await fetch(url);const text=await r.text();return {status:r.status,type:r.headers.get('content-type'),text,url:r.url};};
          const health=await get(base+'/api/health');
          console.log('HEALTH',health.status,health.text);
          const productsResponse=await get(base+'/api/v1/products?limit=5');
          console.log('PRODUCTS_HTTP',productsResponse.status,productsResponse.type);
          const products=JSON.parse(productsResponse.text).items||[];
          for(const p of products){
            console.log('PRODUCT',JSON.stringify({slug:p.slug,name:p.name,cover_url:p.cover_url,image_url:p.image_url,image_type:p.image_type,gabaritos_url:p.gabaritos_url}));
            const imageUrl=p.image_url||p.cover_url||p.technical_preview_url;
            if(imageUrl){
              const image=await get(imageUrl);
              console.log('IMAGE',image.status,image.type,'bytes='+Buffer.byteLength(image.text));
            }else console.log('IMAGE EMPTY');
            if(p.gabaritos_url){
              const listing=await get(p.gabaritos_url);
              console.log('GAB_LIST',listing.status,listing.type,listing.text.slice(0,300));
              if(listing.status===200){
                const d=JSON.parse(listing.text);
                const first=d.items?.[0];
                console.log('GAB_TOTAL',d.total??0,'FIRST',first?.url||'');
                if(first?.url){
                  const file=await get(first.url);
                  console.log('GAB_FILE',file.status,file.type,'bytes='+Buffer.byteLength(file.text),'prefix='+file.text.slice(0,100).replace(/\s+/g,' '));
                }
              }
            }
          }
          NODE
