name: Central Prints Catalog Live Verify

on:
  push:
    branches: [ops/catalog-live-verify]

permissions:
  contents: read

jobs:
  verify-live:
    runs-on: [self-hosted, central-prints, vps, production]
    timeout-minutes: 10
    steps:
      - name: Verify live catalog and deploy state
        shell: bash
        run: |
          set -Eeuo pipefail
          APP='/home/belastock-grafica/htdocs/grafica.belastock.com.br'
          SOURCE='/home/belastock-grafica/.central-prints-import/CentralPrints-TabelaPreco-2026-09-12.xls'
          EXPECTED_SHA='c2a7f6b55d41467851195867e3a6cdfe351f38e947afef2ca7e60045ad62c2c5'

          echo '=== GIT ==='
          sudo -n -u belastock-grafica -H env APP="$APP" bash -lc 'cd "$APP"; printf "HEAD="; git -c safe.directory="$APP" rev-parse HEAD; printf "BRANCH="; git -c safe.directory="$APP" branch --show-current; git -c safe.directory="$APP" status --short'

          echo '=== SOURCE ==='
          sudo -n -u belastock-grafica test -f "$SOURCE"
          sudo -n -u belastock-grafica bash -lc "printf '%s  %s\\n' '$EXPECTED_SHA' '$SOURCE' | sha256sum -c -"
          sudo -n -u belastock-grafica stat -c 'SOURCE_BYTES=%s MODE=%a OWNER=%U GROUP=%G' "$SOURCE"

          echo '=== SYSTEMD ==='
          systemctl --no-pager status central-prints-autodeploy.service 2>/dev/null || true
          systemctl --no-pager status central-prints-autodeploy.timer 2>/dev/null || true

          echo '=== API ==='
          printf 'HEALTH='; curl -fsS --max-time 10 http://127.0.0.1:3005/api/health; echo
          printf 'READY='; curl -fsS --max-time 10 http://127.0.0.1:3005/api/ready; echo
          printf 'RELEASE='; curl -fsS --max-time 10 http://127.0.0.1:3005/api/release; echo
          printf 'SUMMARY='; curl -fsS --max-time 20 http://127.0.0.1:3005/api/v1/catalog/summary; echo
          printf 'PRODUCTS='; curl -fsS --max-time 20 'http://127.0.0.1:3005/api/v1/products?limit=1'; echo
          printf 'SAMPLE_GIFT1515='; curl -sS --max-time 20 -w '\nHTTP=%{http_code}\n' http://127.0.0.1:3005/api/v1/price/GIFT1515; echo

          echo '=== PUBLIC ==='
          printf 'PUBLIC_SUMMARY='; curl -kLfsS --max-time 30 'https://grafica.belastock.com.br/api/v1/catalog/summary?verify=live'; echo
          printf 'PUBLIC_PRODUCT='; curl -kLfsS --max-time 30 'https://grafica.belastock.com.br/api/v1/products?limit=1&verify=live'; echo

          echo 'LIVE_VERIFY=OK'
