name: Central Prints Catalog Load Now

on:
  push:
    branches: [ops/catalog-load-now]

permissions:
  contents: read

jobs:
  catalog-status:
    runs-on: [self-hosted, central-prints, vps, production]
    timeout-minutes: 10
    steps:
      - name: Consultar catálogo atual e conexão da aplicação
        shell: bash
        run: |
          set -Eeuo pipefail
          SOURCE='/tmp/CentralPrints-TabelaPreco-2026-09-12.xls'
          [ -f "$SOURCE" ] && echo "SOURCE_PRESENT=YES SHA=$(sha256sum "$SOURCE" | awk '{print $1}')" || echo 'SOURCE_PRESENT=NO'
          for path in /api/v1/catalog/summary /api/v1/categories '/api/v1/products?limit=1'; do
            code="$(curl -ksS --max-time 10 -o /tmp/cp-api.out -w '%{http_code}' "http://127.0.0.1:3005$path" || true)"
            echo "PATH=$path HTTP=$code BODY_BYTES=$(wc -c < /tmp/cp-api.out 2>/dev/null || echo 0)"
            head -c 2000 /tmp/cp-api.out 2>/dev/null | tr '\n' ' ' || true; echo
          done
