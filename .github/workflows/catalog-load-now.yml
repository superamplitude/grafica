name: Central Prints Catalog Load Now

on:
  push:
    branches: [ops/catalog-load-now]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe-drive-source:
    runs-on: [self-hosted, central-prints, vps, production]
    timeout-minutes: 10
    steps:
      - name: Testar exportação pública da tabela no Google Drive
        shell: bash
        run: |
          set -Eeuo pipefail
          ID='1sFgDMU0TXl-S4y-jbai-6eV5XE6WC2kS'
          for kind in xlsx csv; do
            if [ "$kind" = xlsx ]; then
              URL="https://docs.google.com/spreadsheets/d/$ID/export?format=xlsx"
            else
              URL="https://docs.google.com/spreadsheets/d/$ID/export?format=csv&gid=0"
            fi
            OUT="$RUNNER_TEMP/drive-source.$kind"
            code="$(curl -LksS --max-time 120 -o "$OUT" -w '%{http_code}' "$URL" || true)"
            echo "KIND=$kind HTTP=$code BYTES=$(wc -c < "$OUT" 2>/dev/null || echo 0)"
            file "$OUT" 2>/dev/null || true
            sha256sum "$OUT" 2>/dev/null || true
            head -c 120 "$OUT" 2>/dev/null | tr '\n\r' '  ' | sed 's/[^[:print:]\t]/./g' || true
            echo
          done
