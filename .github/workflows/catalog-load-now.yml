name: Central Prints Catalog Load Now

on:
  push:
    branches: [ops/catalog-load-now]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  discover-zap-table:
    runs-on: [self-hosted, central-prints, vps, production]
    timeout-minutes: 10
    steps:
      - name: Descobrir endpoint real da tabela pública Zap
        shell: bash
        run: |
          set -Eeuo pipefail
          URL='https://www.zapgrafica.com.br/tabelaprecos/tabelaprecosxls'
          OUT="$RUNNER_TEMP/zap-page.html"
          curl -fLksS --max-time 120 "$URL" -o "$OUT"
          echo "BYTES=$(wc -c < "$OUT" | tr -d ' ')"
          python3 - "$OUT" <<'PY'
          import sys,re,html
          s=open(sys.argv[1],'rb').read().decode('utf-8','ignore')
          print('TITLE=',re.sub(r'\s+',' ',re.search(r'<title[^>]*>(.*?)</title>',s,re.I|re.S).group(1)).strip() if re.search(r'<title[^>]*>(.*?)</title>',s,re.I|re.S) else 'NONE')
          vals=[]
          for pat in [r'href=["\']([^"\']+)["\']',r'src=["\']([^"\']+)["\']',r'action=["\']([^"\']+)["\']',r'https?://[^"\'\s<>]+']:
              vals += re.findall(pat,s,re.I)
          seen=set()
          for v in vals:
              v=html.unescape(v)
              if v in seen: continue
              seen.add(v)
              if re.search(r'(xls|csv|tabela|preco|download|export)',v,re.I): print('LINK='+v[:1000])
          for m in re.finditer(r'.{0,180}(xls|csv|download|export|tabela.?pre[cç]o).{0,300}',s,re.I|re.S):
              x=re.sub(r'\s+',' ',m.group(0))
              print('CTX='+x[:600])
          PY
