name: Central Prints Catalog Load Now

on:
  push:
    branches: [ops/catalog-load-now]

permissions:
  contents: read

jobs:
  env-source:
    runs-on: [self-hosted, central-prints, vps, production]
    timeout-minutes: 10
    steps:
      - name: Localizar fonte de ambiente sem expor valores
        shell: bash
        run: |
          set -Eeuo pipefail
          echo 'AUTODEPLOY_SERVICE_BEGIN'
          systemctl show central-prints-autodeploy.service -p User -p Group -p FragmentPath -p EnvironmentFiles -p ExecStart --no-pager 2>/dev/null || true
          echo 'AUTODEPLOY_SERVICE_END'
          echo 'TIMER_BEGIN'
          systemctl show central-prints-autodeploy.timer -p FragmentPath -p NextElapseUSecRealtime --no-pager 2>/dev/null || true
          echo 'TIMER_END'
          echo 'CANDIDATE_ENV_PATHS_BEGIN'
          for f in /etc/default/central-prints /etc/central-prints.env /etc/central-prints/*.env /home/belastock-grafica/.env /home/belastock-grafica/htdocs/grafica.belastock.com.br/.env; do
            [ -e "$f" ] || continue
            printf 'PATH=%s READABLE_RUNNER=%s READABLE_SITE=%s KEYS=' "$f" "$([ -r "$f" ] && echo YES || echo NO)" "$(sudo -n -u belastock-grafica test -r "$f" 2>/dev/null && echo YES || echo NO)"
            if [ -r "$f" ]; then grep -E '^(DB_HOST|DB_PORT|DB_NAME|DB_USER|DB_PASSWORD)=' "$f" 2>/dev/null | cut -d= -f1 | paste -sd, - || true; else echo; fi
          done
          echo 'CANDIDATE_ENV_PATHS_END'
