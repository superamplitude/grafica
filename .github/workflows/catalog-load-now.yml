name: Central Prints Catalog Load Now

on:
  push:
    branches: [ops/catalog-load-now]

permissions:
  contents: read

jobs:
  diagnose-runtime-env:
    runs-on: [self-hosted, central-prints, vps, production]
    timeout-minutes: 10
    steps:
      - name: Localizar ambiente da aplicação sem expor credenciais
        shell: bash
        run: |
          set -Eeuo pipefail
          SOURCE='/tmp/CentralPrints-TabelaPreco-2026-09-12.xls'
          EXPECTED='c2a7f6b55d41467851195867e3a6cdfe351f38e947afef2ca7e60045ad62c2c5'
          if [ -f "$SOURCE" ]; then
            echo "SOURCE_PRESENT=YES BYTES=$(wc -c < "$SOURCE" | tr -d ' ') SHA=$(sha256sum "$SOURCE" | awk '{print $1}')"
          else
            echo 'SOURCE_PRESENT=NO'
          fi
          sudo -n -u belastock-grafica bash -lc '
            set -u
            APP="/home/belastock-grafica/htdocs/grafica.belastock.com.br"
            cd "$APP"
            echo "PWD=$PWD USER=$(whoami) HOME=$HOME"
            echo "ENV_FILES_BEGIN"
            find "$APP" "$HOME" -maxdepth 3 -type f \( -name ".env" -o -name ".env.*" -o -name "*.env" \) -readable -print 2>/dev/null | sort -u | while read -r f; do
              printf "ENV_FILE=%s KEYS=" "$f"
              grep -E "^(DB_HOST|DB_PORT|DB_NAME|DB_USER|DB_PASSWORD)=" "$f" 2>/dev/null | cut -d= -f1 | paste -sd, - || true
            done
            echo "ENV_FILES_END"
            printf "CURRENT_ENV_KEYS="; env | grep -E "^(DB_HOST|DB_PORT|DB_NAME|DB_USER|DB_PASSWORD)=" | cut -d= -f1 | paste -sd, - || true
            echo "PM2_FILES_BEGIN"
            find "$APP" "$HOME" -maxdepth 3 -type f \( -name "ecosystem*.cjs" -o -name "ecosystem*.js" -o -name "*.service" \) -readable -print 2>/dev/null | sort -u | head -50
            echo "PM2_FILES_END"
          '
