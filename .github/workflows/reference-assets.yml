name: Central Prints Reference Assets

on:
  workflow_dispatch:
  push:
    branches: [research/reference-assets]
    paths:
      - '.github/workflows/reference-assets.yml'
      - 'scripts/collect-reference-assets.py'

permissions:
  contents: read

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Collect public reference images
        run: python scripts/collect-reference-assets.py
      - name: Upload reference pack
        uses: actions/upload-artifact@v4
        with:
          name: central-prints-reference-images
          path: reference-assets/
          if-no-files-found: error
          retention-days: 7
