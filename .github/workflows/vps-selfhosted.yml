name: Central Prints VPS Self-Hosted

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: central-prints-vps-selfhosted
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  diagnostics:
    runs-on: [self-hosted, central-prints, vps, production]
    timeout-minutes: 10
    steps:
      - name: Provar execucao dentro da VPS
        shell: bash
        run: |
          set -Eeuo pipefail
          echo "=== ID ==="
          whoami
          id
          hostname
          pwd
          uname -a
          echo
          echo "=== ACESSO AO APP ==="
          APP="/home/belastock-grafica/htdocs/grafica.belastock.com.br"
          ls -ld /home/belastock-grafica /home/belastock-grafica/htdocs "$APP" || true
          if [ -d "$APP/.git" ]; then
            git -c safe.directory="$APP" -C "$APP" rev-parse --short HEAD || true
            git -c safe.directory="$APP" -C "$APP" branch --show-current || true
            git -c safe.directory="$APP" -C "$APP" status --short || true
          fi
          echo
          echo "=== RUNTIME ==="
          command -v node && node --version || true
          command -v npm && npm --version || true
          command -v pm2 && pm2 status || true
          echo
          echo "=== PORTAS ==="
          ss -ltnp 2>/dev/null | grep -E ':(3005|3210)\\b' || true
          echo
          echo "=== HEALTH ==="
          curl -sS -i --max-time 5 http://127.0.0.1:3005/api/health || true
          echo
          echo "=== READY ==="
          curl -sS -i --max-time 5 http://127.0.0.1:3005/api/ready || true
          echo
          echo "=== SUDO NAO-INTERATIVO ==="
          if sudo -n true 2>/dev/null; then
            echo "SUDO_N=OK"
          else
            echo "SUDO_N=NO"
          fi
