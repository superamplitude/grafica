name: Central Prints VPS Self-Hosted

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: central-prints-vps-selfhosted
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  diagnostics:
    runs-on: [self-hosted, central-prints, vps, production]
    timeout-minutes: 10
    steps:
      - name: Diagnostico real da VPS como usuario do site
        shell: bash
        run: |
          set -Eeuo pipefail
          APP="/home/belastock-grafica/htdocs/grafica.belastock.com.br"
          echo "=== RUNNER ==="
          whoami
          id
          hostname
          echo
          echo "=== PERMISSAO DELEGADA ==="
          sudo -n -u belastock-grafica true
          echo "SUDO_SITE_USER=OK"
          echo
          echo "=== APP ==="
          sudo -n -u belastock-grafica -H env APP="$APP" bash -lc 'cd "$APP"; printf "HEAD="; git -c safe.directory="$APP" rev-parse HEAD; printf "BRANCH="; git -c safe.directory="$APP" branch --show-current; echo STATUS_BEGIN; git -c safe.directory="$APP" status --short; echo STATUS_END; printf "ORIGIN="; git -c safe.directory="$APP" remote get-url origin'
          echo
          echo "=== ENV KEYS (SEM VALORES) ==="
          sudo -n -u belastock-grafica -H env APP="$APP" bash -lc 'cd "$APP"; if [ -f .env ]; then sed -E "s/^[[:space:]]*export[[:space:]]+//; /^[[:space:]]*(#|$)/d; s/[[:space:]]*=.*$//" .env | sed -n "1,120p"; else echo ENV_FILE=NO; fi'
          echo
          echo "=== DOTENV STATUS (SEM VALORES) ==="
          sudo -n -u belastock-grafica -H env APP="$APP" bash -lc 'cd "$APP" && node --input-type=module -e "import \"dotenv/config\"; for (const k of [\"DB_HOST\",\"DB_PORT\",\"DB_NAME\",\"DB_USER\",\"DB_PASSWORD\",\"JWT_SECRET\",\"PORT\"]) console.log(k+\"=\"+(process.env[k]?\"SET\":\"MISSING\"));"'
          echo
          echo "=== AUTODEPLOY SYSTEMD ==="
          systemctl --no-pager status central-prints-autodeploy.timer 2>/dev/null || true
          systemctl --no-pager status central-prints-autodeploy.service 2>/dev/null || true
          systemctl cat central-prints-autodeploy.timer 2>/dev/null || true
          systemctl cat central-prints-autodeploy.service 2>/dev/null || true
          echo
          echo "=== PROCESSOS ==="
          ps -eo user:24,pid,ppid,cmd --sort=pid | grep -E '(PM2|central-prints|node .*src/server|node .*preflight)' | grep -v grep || true
          ss -ltnp 2>/dev/null | grep -E ':(3005|3210)\b' || true
          echo
          echo "=== RELEASE/HEALTH ==="
          curl -fsS --max-time 5 http://127.0.0.1:3005/api/health
          echo
          curl -fsS --max-time 5 http://127.0.0.1:3005/api/ready
          echo
          curl -fsS --max-time 5 http://127.0.0.1:3005/api/release || true
          echo
          echo "DIAGNOSTICS=OK"
