name: Central Prints CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: central-prints-ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Validate deployment shell syntax
        run: |
          set -Eeuo pipefail
          for script in deploy/*.sh; do
            echo "bash -n $script"
            bash -n "$script"
          done
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install exact production dependencies
        run: npm ci --omit=dev
      - name: Static and runtime verification
        run: npm run verify
      - name: Production dependency audit
        run: npm audit --omit=dev --audit-level=high
      - name: Export tested package lock
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: package-lock
          path: package-lock.json
          if-no-files-found: error
          retention-days: 3

  mysql-schema:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: rootpass
          MYSQL_DATABASE: central_prints
          MYSQL_USER: central_prints
          MYSQL_PASSWORD: testpass
        ports: ['3306:3306']
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -prootpass"
          --health-interval=5s --health-timeout=5s --health-retries=20
    env:
      DB_HOST: 127.0.0.1
      DB_PORT: 3306
      DB_NAME: central_prints
      DB_USER: central_prints
      DB_PASSWORD: testpass
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci --omit=dev
      - run: npm run migrate && npm run migrate && npm run schema:verify
      - name: Import quarantined Drive reference manifest
        run: npm run reference:import && npm run reference:import
      - name: Verify Drive references remain quarantined
        run: |
          node --input-type=module <<'NODE'
          import 'dotenv/config'; import {getDb} from './src/lib/db.js';
          const db=getDb();
          const [[total]]=await db.query('SELECT COUNT(*) AS n FROM external_reference_assets');
          const [[unsafe]]=await db.query("SELECT COUNT(*) AS n FROM external_reference_assets WHERE ingestion_status='imported' OR review_required=0 OR license_status<>'reference_only'");
          const [[branded]]=await db.query("SELECT COUNT(*) AS n FROM external_reference_assets WHERE supplier_branding_risk='found'");
          if(Number(total.n)<40) throw new Error('REFERENCE_MANIFEST_TOO_SMALL');
          if(Number(unsafe.n)!==0) throw new Error('REFERENCE_QUARANTINE_BROKEN');
          if(Number(branded.n)<1) throw new Error('REFERENCE_BRANDING_HEURISTIC_MISSING');
          console.log(JSON.stringify({ok:true,total:Number(total.n),branded:Number(branded.n)}));
          await db.end();
          NODE
      - name: Verify public price table against MySQL
        run: node src/scripts/verify-price-table.js
      - name: Verify assets, templates, hero and commerce against MySQL
        run: node src/scripts/verify-assets-commerce.js

  mariadb-schema:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      mariadb:
        image: mariadb:11.8
        env:
          MARIADB_ROOT_PASSWORD: rootpass
          MARIADB_DATABASE: central_prints
          MARIADB_USER: central_prints
          MARIADB_PASSWORD: testpass
        ports: ['3306:3306']
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=5s --health-timeout=5s --health-retries=20
    env:
      DB_HOST: 127.0.0.1
      DB_PORT: 3306
      DB_NAME: central_prints
      DB_USER: central_prints
      DB_PASSWORD: testpass
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci --omit=dev
      - run: npm run migrate && npm run migrate && npm run schema:verify
      - name: Import quarantined Drive reference manifest
        run: npm run reference:import && npm run reference:import
      - name: Verify Drive references remain quarantined
        run: |
          node --input-type=module <<'NODE'
          import 'dotenv/config'; import {getDb} from './src/lib/db.js';
          const db=getDb();
          const [[total]]=await db.query('SELECT COUNT(*) AS n FROM external_reference_assets');
          const [[unsafe]]=await db.query("SELECT COUNT(*) AS n FROM external_reference_assets WHERE ingestion_status='imported' OR review_required=0 OR license_status<>'reference_only'");
          const [[branded]]=await db.query("SELECT COUNT(*) AS n FROM external_reference_assets WHERE supplier_branding_risk='found'");
          if(Number(total.n)<40) throw new Error('REFERENCE_MANIFEST_TOO_SMALL');
          if(Number(unsafe.n)!==0) throw new Error('REFERENCE_QUARANTINE_BROKEN');
          if(Number(branded.n)<1) throw new Error('REFERENCE_BRANDING_HEURISTIC_MISSING');
          console.log(JSON.stringify({ok:true,total:Number(total.n),branded:Number(branded.n)}));
          await db.end();
          NODE
      - name: Verify public price table against MariaDB
        run: node src/scripts/verify-price-table.js
      - name: Verify assets, templates, hero and commerce against MariaDB
        run: node src/scripts/verify-assets-commerce.js
